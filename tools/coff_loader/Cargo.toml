[package]
name     = "coff_loader"
version  = "0.1.0"
edition  = "2021"
build    = "build.rs"
autolib  = false

[[bin]]
name = "coff_loader"
path = "src/lib.rs"

[profile.release]
opt-level       = "z"
panic           = "abort"
lto             = "fat"
codegen-units   = 1
strip           = false   # keep section names so loader.py can extract .text
debug           = false
overflow-checks = false
